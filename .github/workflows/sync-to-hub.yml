name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  # to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # IMPORTANT: Replace YOUR_USERNAME/YOUR_SPACE_NAME with your actual Hugging Face Space ID
          # e.g. CodeBreakerYT/Deepfake-Detection-System
          HF_SPACE: 'PikachuEX/aideepfake'
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git subtree split --prefix backend -b deploy
          git push https://CodeBreakerYT:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE deploy:main --force
