name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  # to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # IMPORTANT: Replace YOUR_USERNAME/YOUR_SPACE_NAME with your actual Hugging Face Space ID
          # e.g. CodeBreakerYT/Deepfake-Detection-System
          HF_SPACE: 'PikachuEX/aideepfake'
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # Create a fresh deployment directory containing only the backend
          mkdir ../hf_deploy
          cp -a backend/. ../hf_deploy/
          cd ../hf_deploy
          
          # Initialize a clean git repository
          git init
          git lfs install
          
          # Force Git LFS to track model weights to prevent Hugging Face's 10MB limit rejection
          git lfs track "*.pth" "*.pt" "*.bin" "*.h5"
          
          git add .
          git commit -m "Deploy backend to Hugging Face Space"
          
          # Force push to the Space (this overwrites the space history with this clean commit)
          git push https://CodeBreakerYT:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE HEAD:main --force
